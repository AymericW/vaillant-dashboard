# Copy this file to config.toml and fill in your details.

# Which Vaillant system you have:
#   "vsmart"     - the round vSMART / eRELAX thermostat with the "vSMART" app
#   "myvaillant" - sensoCOMFORT / sensoHOME / VRC 700 with the "myVAILLANT" app
system = "vsmart"

[vsmart]
# The login you use in the vSMART app
email = "you@example.com"
password = "your-password"
# The vSMART app's own key (not your password). See README, "vSMART: the client secret".
client_secret = ""
client_id = "na_client_android_vaillant"
user_prefix = "vaillant"
app_version = "1.0.4.0"

[vaillant]
# Only used when system = "myvaillant". The login of the myVAILLANT phone app
email = "you@example.com"
password = "your-password"
brand = "vaillant"        # vaillant | sdbg (Saunier Duval) | bulex | glow-worm | demirdokum
country = "belgium"       # e.g. belgium, france, germany, netherlands, unitedkingdom ...
# How often to ask the cloud for new data (vSMART: at least every 300 s). Don't go much lower than 60:
# Vaillant rate-limits the API and may block you temporarily.
poll_seconds = 120
energy_refresh_minutes = 60

[server]
host = "127.0.0.1"        # use "0.0.0.0" to reach the dashboard (or push sensor data) from other devices on your network
port = 8321
open_browser = true

[external_sensor]
# Optional second thermometer, to check the Vaillant reading and optionally heat to it.
#   none      - no external sensor
#   push      - the sensor sends readings to http://<this-pc>:8321/api/external?temp=21.3&hum=45
#               (Shelly H&T: Settings > Actions / Webhooks; needs host = "0.0.0.0" above)
#   shelly    - the app reads a mains/USB powered Shelly sensor at `url` (e.g. "http://192.168.1.50")
#   http_json - the app reads any JSON URL, e.g. a Home Assistant / ESPHome / Tasmota endpoint
mode = "none"
name = "Living room sensor"
url = ""
temperature_path = "temperature"   # for http_json, dotted path into the JSON, e.g. "StatusSNS.SI7021.Temperature"
humidity_path = "humidity"
poll_seconds = 60
max_age_minutes = 30               # ignore readings older than this

[compensation]
# Used when "Heat to the external sensor" is switched on in the dashboard.
max_offset = 3.0                   # never shift the Vaillant target by more than this (°C)
min_minutes_between_changes = 15   # don't spam the boiler / API
veto_hours = 2.0                   # override length; it expires by itself if the app stops
